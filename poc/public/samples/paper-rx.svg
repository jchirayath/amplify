<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Photo of a handwritten paper eyeglass prescription for Maya Patel (sample)">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7a66"/><stop offset="1" stop-color="#6b5d4d"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#ece6d6"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#desk)"/>
  <g transform="rotate(-3 400 300)" filter="url(#shadow)">
    <rect x="110" y="50" width="580" height="500" fill="url(#paper)"/>
    <g font-family="Georgia, serif" fill="#1d3a5f">
      <text x="140" y="95" font-size="26" font-weight="bold">Brightline Optical</text>
      <text x="140" y="118" font-size="13" fill="#4b5d73">Eye examination · Spectacle prescription</text>
    </g>
    <line x1="140" y1="132" x2="660" y2="132" stroke="#1d3a5f" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="14" fill="#4b5d73">
      <text x="140" y="165">Patient</text><text x="440" y="165">Date</text>
      <text x="140" y="430">PD</text><text x="400" y="505">Signature</text>
    </g>
    <g font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" fill="#14306e">
      <text x="200" y="167" font-size="24">Maya Patel</text>
      <text x="485" y="167" font-size="22">today</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3a5f">
      <text x="230" y="215">SPH</text><text x="330" y="215">CYL</text><text x="430" y="215">AXIS</text><text x="530" y="215">ADD</text>
      <text x="150" y="275">OD</text><text x="150" y="355">OS</text>
    </g>
    <g stroke="#9aa6b5" stroke-width="1.2" fill="none">
      <rect x="140" y="228" width="520" height="160"/>
      <line x1="140" y1="308" x2="660" y2="308"/>
      <line x1="210" y1="228" x2="210" y2="388"/><line x1="310" y1="228" x2="310" y2="388"/>
      <line x1="410" y1="228" x2="410" y2="388"/><line x1="510" y1="228" x2="510" y2="388"/>
      <line x1="170" y1="438" x2="300" y2="438"/><line x1="480" y1="510" x2="660" y2="510"/>
    </g>
    <g font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" fill="#14306e" font-size="28">
      <text x="222" y="280">-2.50</text><text x="322" y="280">-0.75</text><text x="440" y="280">180</text><text x="545" y="280">—</text>
      <text x="222" y="360">-2.00</text><text x="322" y="360">-0.50</text><text x="440" y="360">175</text><text x="545" y="360">—</text>
      <text x="190" y="432">63</text>
      <path d="M490 500 c20-30 30 10 45-12 s25-18 35 4 s20-10 40-6" stroke="#14306e" stroke-width="2.5" fill="none"/>
    </g>
  </g>
  <text x="790" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#f2ead9" opacity="0.8">SAMPLE · fictional patient</text>
</svg>
